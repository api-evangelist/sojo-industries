apis:
- name: Sojo Shield Platform API
  description: >-
    The Sojo Shield track-and-trace platform API, versioned in-path at /api/v3/ and consumed by the Sojo
    Shield web application at sojoshield.com. Sojo publishes a Swagger UI for it at api.sojoshield.com/docs
    titled "Shield API"; every data path requires a bearer token, and as of 2026-08-28 the spec document
    that Swagger UI loads (/swagger.json) returns HTTP 503 "Swagger spec not initialised", so no machine-readable
    contract can currently be retrieved.
  humanURL: https://api.sojoshield.com/docs
