apis:
- name: SOJO Planning Assistant (Victoria) API
  description: >-
    The HTTP surface for Victoria, the SOJO Planning Assistant — a LangGraph-backed agent over
    Sojo's production and machine-telemetry data. Publishes a public OpenAPI 3.0.3 describing
    non-streaming orchestration, SSE streaming chat, conversation CRUD/export, image upload and
    health/readiness probes, and serves a Model Context Protocol streamable-HTTP endpoint at /mcp
    for Claude Desktop and ChatGPT clients. Authenticated routes take a Stytch session JWT.
  humanURL: https://sojoshield.com/
