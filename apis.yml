aid: sojo-industries
name: Sojo Industries
description: >-
  Sojo Industries is a national industrial-automation and supply-chain technology company
  founded in 2021 and headquartered in Bristol, Pennsylvania, serving the food and beverage
  industry with robotics-driven variety packing, multi-packing and assembly. It operates
  fixed Sojo Hubs across Pennsylvania, New Jersey, California and Texas plus Sojo Flight
  mobile manufacturing lines that are trucked to a customer's own plant to eliminate freight,
  labour and packaging cost. Its software arm is Sojo Shield, a blockchain-backed track-and-trace
  platform — a Built for NetSuite SuiteApp — that captures geolocated critical tracking events
  from the factory floor through to the retailer so brands can meet the FDA FSMA Rule 204 Food
  Traceability requirements, and Sojo Seal, GPS-enabled tamper-evident seals. Its API surface is
  the Sojo Shield platform API at api.sojoshield.com and a production Model Context Protocol
  server for "Victoria", the SOJO Planning Assistant, which exposes production, machine-telemetry,
  dieline and pallet-pattern planning tools to MCP clients.
