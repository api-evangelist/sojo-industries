domain_standards:
- id: fsma-204
  name: 'FDA FSMA Section 204 Food Traceability Rule (21 CFR 1 Subpart S)'
  conforms: false
  declared_in_contract: false
  evidence: >-
    This is the standard Sojo Shield is built for and it is the single most important standard in
    its market — but it is NOT declared in any contract we can retrieve. The Victoria OpenAPI never
    mentions it; the Shield API spec that would carry Critical Tracking Event / Key Data Element
    shapes is the one returning HTTP 503 at https://api.sojoshield.com/swagger.json. The claim is
    made only in prose.
  claim_sources:
  - https://www.businesswire.com/news/home/20250205330831/en/Sojo-Shield-Achieves-Built-for-NetSuite-Status
  - https://www.bevnet.com/news/supplier-news/2024/sojo-industries-launches-track-and-trace-platform-for-food-and-beverage/
  remedy: >-
    Publishing the Shield OpenAPI with CTE/KDE-shaped schemas — or a GS1 EPCIS 2.0 event surface —
    would turn the strongest sales claim Sojo makes into something a buyer's integration team can
    verify without a call. Today an integrator who already speaks FSMA 204 has no way to tell
    whether Shield speaks it too.
- id: gs1-epcis
  name: 'GS1 EPCIS 2.0 / CBV (supply-chain event standard)'
  conforms: false
  declared_in_contract: false
  evidence: >-
    No EPCIS event vocabulary, no GS1 identifier scheme (GTIN/SSCC/GLN) and no CBV business step
    appears in any retrievable contract or in the six MCP tool schemas. Sojo Shield describes QR-code
    scans and geolocated critical tracking events in prose, which is EPCIS-shaped territory, but the
    standard is never named.

