description: >-
  Binds the six live MCP tools on the SOJO Planning Assistant to the REST operations
  published in the same service's OpenAPI. The two surfaces are deliberately NON-
  OVERLAPPING here: the REST contract exposes the conversational shell (orchestrate,
  streaming chat, conversation CRUD, image upload, health) while every tool exposes the
  planning/production data core behind it. There is no REST operation that calls a named
  tool directly, so the honest crosswalk is "no 1:1 binding" for all six.

surfaces:
  openapi:
    file: openapi/sojo-industries-victoria-agent-openapi.json
    url: https://victoria-agent.sojoshield.com/openapi.json
    gated: false
    note: >-
      Fetched anonymously, HTTP 200. Declares no operationId on any of its 10 operations,
      so crosswalk rows below reference METHOD+PATH rather than operationId.
  mcp:
    url: https://victoria-agent.sojoshield.com/mcp
    gated: false
    note: 'initialize + tools/list succeeded anonymously; inputSchemas are the real published ones.'
  graphql:
    url: null
    note: 'No GraphQL surface found. https://api.sojoshield.com/graphql returns 401 UNAUTHORIZED (the host-wide auth wall), not a GraphQL error.'
  shield_rest:
    url: https://api.sojoshield.com/api/v3/
    gated: true
    note: >-
      The Sojo Shield product API. Every path returns 401 "No bearer token provided."
      Its Swagger UI is public at https://api.sojoshield.com/docs but the spec it loads
      (/swagger.json) returns HTTP 503 {"error": "Swagger spec not initialised"}, so no
      operations can be crosswalked to it.

