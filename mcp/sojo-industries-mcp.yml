auth_note: >-
  DISCOVERY is anonymous — initialize and tools/list require no credentials, so an agent
  can read the full tool contract without an account. INVOCATION is a separate question:
  /health reports auth_enabled=true and the sibling REST routes (/orchestrate, /api/chat)
  require a Stytch session JWT resolved against Shield /api/internal/v1/auth/resolve.
  We did not call any tool, so we do not assert whether tools/call is gated.

tools:
- name: query_database
  category: data-query
  summary: >-
    Primary RAG-backed tool. Routes SOJO-specific questions across production totals
    (NetSuite Assembly Build views), machine efficiency/uptime/downtime/OEE (Raven),
    equipment specs and domain knowledge, returning SQL patterns and documentation.
  parameters: [question, query, context, session_id, skus, line, facility, num_flavors, pack_size, difference_type, desc1, desc2, output_case]
  required: []
- name: list_tables
  category: schema-introspection
  summary: List available tables in a database schema.
  parameters: [database]
  required: []
- name: describe_table
  category: schema-introspection
  summary: Get table schema (columns, data types).
  parameters: [table_name, database]
  required: [table_name]
- name: get_table_sample
  category: schema-introspection
  summary: Get sample rows from a table.
  parameters: [table_name, limit, database]
  required: [table_name]
- name: analyze_dieline
  category: packaging-engineering
  summary: >-
    Analyse an uploaded carton/dieline/packaging drawing — pack size, case dimensions,
    flap lengths, board type, can size — against a target packaging line.
  parameters: [pack_size, case_length, case_width, case_height, minor_flap_length, major_flap_top, is_corrugate, target_line, board_type, can_size, confirmed, extraction_notes, image_id, session_id]
  required: [pack_size]
- name: analyze_pallet_pattern
  category: packaging-engineering
  summary: >-
    Check a pallet pattern against SOJO's commissioned patterns — pack config, can size,
    shipper geometry, cases per layer, layers per load, target palletiser.
  parameters: [pack_config, can_size, shipper_type, shipper_length, shipper_width, shipper_height, cases_per_layer, layers_per_load, picks_per_layer, shipper_pattern, pallet_pattern, target_palletizer, confirmed, image_id, session_id]
  required: [pack_config]

tool_count: 6
