name: SOJO Planning Assistant MCP Server
description: >-
  Sojo Industries operates a production Model Context Protocol server for "Victoria",
  the SOJO Planning Assistant. It is a remote streamable-HTTP MCP endpoint fronting the
  Sojo Shield production/planning data core — NetSuite assembly-build production views,
  Raven machine telemetry (OEE, uptime, downtime), dieline/carton geometry analysis and
  palletiser pattern compatibility. The endpoint is advertised by the provider's own
  OpenAPI at https://victoria-agent.sojoshield.com/openapi.json, which states the MCP
  streamable-http transport is served at /mcp "used by Claude Desktop / ChatGPT clients".

